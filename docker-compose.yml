version: '3.8'

services:
  aljo-chat-backend:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - PORT=5000
    volumes:
      - .:/usr/src/backend-app
      - /usr/src/backend-app/node_modules
